# Nginx PÚBLICO — única puerta de entrada del sistema central.
# Sirve el frontend en / y reenvía /api/ y /socket.io/ al backend.
#
# Este archivo cubre HTTP (puerto 80). Para producción real con dominio propio,
# añade el bloque TLS (ver deploy/README.md, sección HTTPS con Let's Encrypt) y
# redirige 80 -> 443.

upstream lumi_frontend {
    server frontend:80;
}

upstream lumi_backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    # Tamaño máximo de cuerpo (ajusta si subes archivos grandes).
    client_max_body_size 10m;

    # ── Frontend (Angular estático) ──────────────────────────
    location / {
        proxy_pass http://lumi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API REST del backend ─────────────────────────────────
    # El backend tiene prefijo global /api/v1, así que /api/ llega tal cual.
    location /api/ {
        proxy_pass http://lumi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.IO) ────────────────────────────────
    # Socket.IO usa /socket.io/ como ruta de transporte; los namespaces
    # (/dashboard, /agents) los resuelve internamente.
    location /socket.io/ {
        proxy_pass http://lumi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
