# Nginx interno del contenedor de frontend.
# Solo sirve los estáticos de Angular. El proxy hacia el backend y el TLS los
# maneja el Nginx PÚBLICO (deploy/nginx/nginx.conf), no este.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta desconocida devuelve index.html para que
    # el router de Angular resuelva del lado del cliente al recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para los assets con hash en el nombre (no cambian).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un deploy nuevo se tome de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
